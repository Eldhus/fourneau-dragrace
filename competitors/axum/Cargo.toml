[package]
name = "dragrace-axum"
version = "0.1.0"
edition = "2021"

# axum as its users write it: axum::serve on tokio's multi-threaded runtime
# (one worker per core). Versions are locked in Cargo.lock.
[dependencies]
# http2: axum::serve then speaks HTTP/2 by prior knowledge beside HTTP/1.1.
axum = { version = "0.8", features = ["http2"] }
# The templates workload: askama compiles templates/menu.html into Rust.
askama = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# The SSE workload: Datastar's signals are JSON in a query parameter;
# axum's Sse takes a stream of events.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
# The conduit workload: sqlx's SQLite (bundled), its timestamps with chrono.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# HTTPS (--tls-cert): rustls through tokio-rustls, each connection served
# by hyper-util's HTTP/1.1-or-HTTP/2 builder, as axum's low-level-rustls
# example does (axum::serve speaks no TLS).
tokio-rustls = "0.26"
rustls-pki-types = "1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }

[profile.release]
codegen-units = 1
lto = true
