# The build the racer races and the site host deploys:
# the site, every competitor, oha's pin and the dragrace tool, at this
# commit and fourneau's and roux's masters, checked by a smoke race and
# released as one. A build is named by those three commits, so a run whose
# build exists stops at once: on a push to master, daily (fourneau or roux
# may have moved), and by hand. A pull request is built and raced the
# same, never released. roux's platform and tools, and each competitor,
# are compiled only when their key is new (keys.go), from a store GitHub's
# cache keeps. The newest 20 builds are kept. No secrets: the release is
# made with this run's own token, and a fork's pull request gets a
# read-only one.
name: build
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'Eldhus/fourneau-dragrace'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ github.event_name != 'pull_request' }}
    steps:
      # This repository beside fourneau and roux, as the README says.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fourneau-dragrace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Eldhus/fourneau
          ref: master
          path: fourneau
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Eldhus/roux
          ref: master
          path: roux
      # The key: the three commits. A build of it that has all three files
      # exists: done. One cut short (fewer files) is made again.
      - name: The key
        id: key
        run: |
          short() { git -C "$1" rev-parse HEAD | cut -c1-12; }
          tag="build-$(short fourneau-dragrace)-$(short roux)-$(short fourneau)"
          echo "this build: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" != true ]; then exit 0; fi
          assets=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [ "$(echo "$assets" | grep -cxE 'build\.json|race\.tar\.gz|site\.tar\.gz')" = 3 ]; then
            echo "built already"
            echo "built=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
      - if: steps.key.outputs.built != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fourneau-dragrace/tools/go.mod
          cache: false
      # The toolchain's downloads and the store of roux's and the
      # competitors' builds (keys.go: an entry is taken only under its
      # exact key, so restoring the newest copy is safe). Started afresh
      # when roux's pins move, which rebuilds most of it anyway, so old
      # toolchains never pile up; saved only when something was added.
      - if: steps.key.outputs.built != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fourneau-dragrace
          key: dragrace-${{ hashFiles('roux/toolchain.json') }}-${{ github.run_id }}
          restore-keys: dragrace-${{ hashFiles('roux/toolchain.json') }}-
      - if: steps.key.outputs.built != 'true'
        name: The cache before
        id: before
        run: echo "listing=$(find ~/.cache/fourneau-dragrace -maxdepth 2 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # The conduit workload's seeded database is made with the sqlite3 shell.
      - if: steps.key.outputs.built != 'true'
        name: The sqlite3 shell
        run: command -v sqlite3 || (sudo apt-get update -q && sudo apt-get install -y -q sqlite3)
      - if: steps.key.outputs.built != 'true'
        name: The tool
        working-directory: fourneau-dragrace
        env:
          CGO_ENABLED: "0"
        run: |
          test -z "$(gofmt -l tools)"
          (cd tools && go vet ./... && go test ./...)
          go build -C tools -ldflags "-X main.buildCommit=$(git rev-parse HEAD)" -o ../out/dragrace ./cmd/dragrace
      # roux readied first (from the store, or built and stored), then the site.
      - if: steps.key.outputs.built != 'true'
        name: The site
        working-directory: fourneau-dragrace
        run: out/dragrace site build
      # Every competitor (from the store, or built and stored); those that
      # moved since the latest release checked and raced briefly, all of
      # them when the harness moved (keys.go, smokeSet), none for the site
      # alone. Nothing is released that did not pass. No build.json (no
      # release, or GitHub failing) races them all. fourneau-zig and roux
      # serve HTTPS through the kernel's TLS, a module the runner has but
      # has not loaded; without it their TLS cells cannot start, and the
      # race refuses at once (local.go, checkKernelTLS).
      - if: steps.key.outputs.built != 'true'
        name: The smoke race
        working-directory: fourneau-dragrace
        run: |
          sudo modprobe tls
          gh release download -R "$GITHUB_REPOSITORY" --pattern build.json -D out/last --clobber \
            || echo "no latest build.json: every competitor races"
          out/dragrace race local -quick -since out/last/build.json -server-cpus 0-1 -loader-cpus 2-3
      - if: steps.key.outputs.built != 'true' && env.RELEASE == 'true'
        name: Release, and keep the newest 20
        working-directory: fourneau-dragrace
        run: |
          tag=${{ steps.key.outputs.tag }}
          out/dragrace bundle -out out/bundle
          gh release create "$tag" --target "$(git rev-parse HEAD)" --title "$tag" \
            --notes-file out/bundle/build.json --latest \
            out/bundle/race.tar.gz out/bundle/site.tar.gz out/bundle/build.json
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("build-"))) | sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
      - if: steps.key.outputs.built != 'true' && env.RELEASE == 'true'
        name: The cache after
        id: after
        run: echo "listing=$(find ~/.cache/fourneau-dragrace -maxdepth 2 | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.built != 'true' && env.RELEASE == 'true' && steps.after.outputs.listing != steps.before.outputs.listing
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fourneau-dragrace
          key: dragrace-${{ hashFiles('roux/toolchain.json') }}-${{ github.run_id }}
