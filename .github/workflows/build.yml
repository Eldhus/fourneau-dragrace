# The build the racer races and the site host deploys: on every push to master, and
# when the racer dispatches it for new commits in fourneau or roux. It
# builds every competitor, oha's pin, the site and the dragrace tool at the
# heads of this repository, fourneau and roux, and releases them as
# build-<UTC>: race.tar.gz, site.tar.gz and build.json (the commits and
# the files' SHA-256, also the release's body). The newest 20 builds are
# kept. No secrets: the release is made with this run's own token.
name: build
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: false
permissions:
  contents: write
# The competitors' dependencies and compiler caches, kept between builds: only caches their own
# tools key by content (Cargo, Go, Zig), so a stale entry is never used.
# Roc's compile cache is left out: `roc build` can reuse a stale binary
# (a known trap); its downloaded packages, pinned by hash, are
# kept. ci.yml restores the same list, which must match this one: the
# cache's version is a hash of it.
env:
  DEPS_PATHS: |
    ~/.cargo/registry
    ~/.cargo/git
    fourneau-dragrace/competitors/axum/target
    ~/go/pkg/mod
    ~/.cache/go-build
    ~/.cache/zig
    fourneau-dragrace/competitors/fourneau-zig/.zig-cache
    roux/.zig-cache
    ~/.cache/roc/packages
jobs:
  build:
    if: github.repository == 'Eldhus/fourneau-dragrace'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fourneau-dragrace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Eldhus/fourneau
          ref: master
          path: fourneau
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Eldhus/roux
          ref: master
          path: roux
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fourneau-dragrace/tools/go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fourneau-dragrace
          key: toolchain-${{ hashFiles('fourneau-dragrace/versions.json') }}
      # The deps cache's key: the ISO week, so it starts afresh each week
      # (Zig's and Cargo's caches only grow), and the pins it was built
      # with. Each build saves its own (the run's id last): a cache hit on
      # an exact key is never saved again, which froze the cache from
      # 2026-10-10 to 10-12.
      - name: The deps cache's key
        id: deps
        run: echo "prefix=deps-$(date -u +%G-W%V)-${{ hashFiles('fourneau-dragrace/competitors/axum/Cargo.lock', 'fourneau-dragrace/competitors/go/go.sum', 'fourneau-dragrace/versions.json') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_PATHS }}
          key: ${{ steps.deps.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.deps.outputs.prefix }}-
      # The conduit workload's seeded database is made with the sqlite3 shell.
      - name: The sqlite3 shell
        run: command -v sqlite3 || (sudo apt-get update -q && sudo apt-get install -y -q sqlite3)
      - name: Build the tool
        working-directory: fourneau-dragrace
        env:
          CGO_ENABLED: "0"
        run: |
          go build -C tools -ldflags "-X main.buildCommit=${GITHUB_SHA}" -o ../out/dragrace ./cmd/dragrace
      - name: Build the competitors and the site
        working-directory: fourneau-dragrace
        run: |
          out/dragrace build
          out/dragrace site build
      - name: Bundle
        working-directory: fourneau-dragrace
        run: out/dragrace bundle -out out/bundle
      - name: Release, and keep the newest 20
        working-directory: fourneau-dragrace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%dT%H%M%SZ)"
          gh release create "$tag" --title "$tag" --notes-file out/bundle/build.json --latest \
            out/bundle/race.tar.gz out/bundle/site.tar.gz out/bundle/build.json
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' |
            sort -r | tail -n +21 | while read -r old; do
              gh release delete "$old" --cleanup-tag --yes
            done
      # Saved after the release, so it never delays one, and only from a
      # build that succeeded. Bounded: past 4 GiB it is not saved, and the
      # next build restores the last one that was (GitHub keeps 10 GiB a
      # repository).
      - name: The deps cache's size
        id: size
        run: |
          total=0
          while read -r path; do
            path="${path/#\~/$HOME}"
            if [ -n "$path" ] && [ -e "$path" ]; then
              total=$((total + $(du -sb "$path" | cut -f1)))
            fi
          done <<< "$DEPS_PATHS"
          echo "deps cache: $((total / 1048576)) MiB"
          if [ "$total" -le $((4 * 1073741824)) ]; then
            echo "bounded=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.size.outputs.bounded == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_PATHS }}
          key: ${{ steps.deps.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
