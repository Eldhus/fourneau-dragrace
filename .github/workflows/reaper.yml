# Every six hours: delete race droplets older than race.json allows, in
# case a nightly died before its own cleanup ran. Costs nothing when there
# is nothing to reap.
name: reaper
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reap:
    if: github.repository == 'Eldhus/fourneau-dragrace'
    runs-on: ubuntu-26.04
    environment: dragrace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fourneau-dragrace
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fourneau-dragrace/tools/go.mod
          cache: false
      - working-directory: fourneau-dragrace
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: go run -C tools ./cmd/dragrace reap
