#cloud-config
disable_root: true
ssh_pwauth: false
users:
  - name: cook
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys: ["ssh-rsa  fourneau-dragrace-admin"]
  - name: racer
    system: true
    shell: /usr/sbin/nologin
  - name: guard
    system: true
    shell: /usr/sbin/nologin
package_update: true
package_upgrade: true
packages: [ufw, unattended-upgrades]
runcmd:
  - ufw default deny incoming
  - ufw allow 22/tcp
  - ufw --force enable
